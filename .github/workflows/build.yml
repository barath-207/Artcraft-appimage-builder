name: Build ArtCraft AppImages

on:
  schedule:
    - cron: "20 3 * * *" # 08:50 Asia/Kolkata
  workflow_dispatch:
    inputs:
      app:
        description: Build one app or all five
        required: true
        type: choice
        options: [all, pdfcraft, photocraft, gridcraft, filmcraft, wordcraft]
        default: all
      force:
        description: Rebuild selected apps even when upstream commits are unchanged
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: artcraft-multi-repo-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.app != 'all' && inputs.app != '' && format('["{0}"]', inputs.app) || '["pdfcraft","photocraft","gridcraft","filmcraft","wordcraft"]') }}

    permissions:
      contents: read

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1

    steps:
      - name: Configure app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.app }}" in
            pdfcraft)
              repo=storytold/pdfcraft
              display=PdfCraft
              target=barath-207/pdfcraft-appimage
              ;;
            photocraft)
              repo=storytold/photocraft
              display=PhotoCraft
              target=barath-207/photocraft-appimage
              ;;
            gridcraft)
              repo=storytold/gridcraft
              display=GridCraft
              target=barath-207/gridcraft-appimage
              ;;
            filmcraft)
              repo=storytold/filmcraft
              display=FilmCraft
              target=barath-207/filmcraft-appimage
              ;;
            wordcraft)
              repo=storytold/wordcraft
              display=WordCraft
              target=barath-207/wordcraft-appimage
              ;;
            *)
              echo "Unknown application" >&2
              exit 1
              ;;
          esac

          {
            echo "repo=$repo"
            echo "display=$display"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve upstream and compare with app's latest release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.ARTCRAFT_RELEASE_TOKEN }}
          SOURCE_REPO: ${{ steps.app.outputs.repo }}
          TARGET_REPO: ${{ steps.app.outputs.target }}
          APP: ${{ matrix.app }}
          FORCE: ${{ inputs.force || false }}
        shell: bash
        run: |
          set -euo pipefail

          # Scheduled cadence: all apps every 2 days; PhotoCraft every 4 days.
          # The anchor date is 2026-11-20 in Asia/Kolkata.
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            anchor_epoch="$(TZ=Asia/Kolkata date -d '2026-11-20 00:00:00' +%s)"
            today_epoch="$(TZ=Asia/Kolkata date -d "$(TZ=Asia/Kolkata date +%F) 00:00:00" +%s)"
            days_since_anchor=$(( (today_epoch - anchor_epoch) / 86400 ))
            interval=2
            [[ "$APP" == "photocraft" ]] && interval=4

            if (( days_since_anchor < 0 || days_since_anchor % interval != 0 )); then
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "Skipping $APP: scheduled interval is every ${interval} days from 2026-11-20 IST."
              exit 0
            fi
          fi

          release_tag="v$(TZ=Asia/Kolkata date +'%Y.%m.%d')"

          sha="$(git ls-remote "https://github.com/${SOURCE_REPO}.git" refs/heads/main | awk '{print $1}')"

          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Could not resolve ${SOURCE_REPO} main" >&2
            exit 1
          }

          old_sha=""
          if gh release view --repo "$TARGET_REPO" --json body \
              --jq '.body' > /tmp/latest-release-body.txt 2>/dev/null; then
            old_sha="$(sed -n 's/^upstream_commit=\([0-9a-f]\{40\}\)$/\1/p' \
              /tmp/latest-release-body.txt | head -n1)"
          fi

          if [[ "$FORCE" == "true" || "$sha" != "$old_sha" ]]; then
            build=true
          else
            build=false
          fi

          {
            echo "sha=$sha"
            echo "build=$build"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

          echo "Application: $APP"
          echo "Target: $TARGET_REPO"
          echo "Upstream: $sha"
          echo "Previous release commit: ${old_sha:-none}"
          echo "Build required: $build"

      - name: Checkout upstream source
        if: steps.upstream.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.app.outputs.repo }}
          ref: ${{ steps.upstream.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Checkout pinned Craft fonts
        if: steps.upstream.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false

      - name: Checkout PdfCraft pinned translations
        if: matrix.app == 'pdfcraft' && steps.upstream.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-i18n
          ref: 575cfdef63227b14daf173b8cc87928bfdfa325e
          path: craft-i18n
          persist-credentials: false

      - name: Install Ubuntu 22.04 build dependencies
        if: steps.upstream.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang curl git pkg-config cmake \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev libudev-dev libssl-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev \
            desktop-file-utils appstream python3-yaml

      - name: Install stable Rust
        if: steps.upstream.outputs.build == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        if: steps.upstream.outputs.build == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> source/target
          shared-key: ${{ matrix.app }}-ubuntu-22.04-x86_64

      - name: Build and package AppImage
        if: steps.upstream.outputs.build == 'true'
        working-directory: source
        env:
          APP: ${{ matrix.app }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_I18N_DIR: ${{ github.workspace }}/craft-i18n
        shell: bash
        run: |
          set -euo pipefail

          case "$APP" in
            pdfcraft)
              export PDFCRAFT_BUILD_SHA="$UPSTREAM_SHA"
              ;;
            photocraft)
              export PHOTOCRAFT_BUILD_SHA="$UPSTREAM_SHA"
              unset CRAFT_I18N_DIR CRAFT_I18N_REQUIRED
              ;;
            gridcraft)
              export GRIDCRAFT_BUILD_SHA="$UPSTREAM_SHA"
              unset CRAFT_I18N_DIR CRAFT_I18N_REQUIRED
              ;;
            filmcraft)
              export FILMCRAFT_BUILD_SHA="$UPSTREAM_SHA"
              unset CRAFT_I18N_DIR CRAFT_I18N_REQUIRED
              ;;
            wordcraft)
              export WORDCRAFT_BUILD_SHA="$UPSTREAM_SHA"
              unset CRAFT_I18N_DIR CRAFT_I18N_REQUIRED
              ;;
          esac

          packaging/linux/package.sh --formats appimage

          shopt -s nullglob
          images=(dist/release/*-linux-x86_64.AppImage)

          if [[ ${#images[@]} -ne 1 ]]; then
            echo "Expected one x86_64 AppImage, found ${#images[@]}" >&2
            printf '%s\n' "${images[@]}"
            exit 1
          fi

          case "$APP" in
            pdfcraft)   name=PdfCraft ;;
            photocraft) name=PhotoCraft ;;
            gridcraft)  name=GridCraft ;;
            filmcraft)  name=FilmCraft ;;
            wordcraft)  name=WordCraft ;;
          esac

          mkdir -p ../out
          install -m 0755 "${images[0]}" "../out/${name}-latest-x86_64.AppImage"
          printf '%s\n' "$UPSTREAM_SHA" > "../out/${APP}.commit"

          file "../out/${name}-latest-x86_64.AppImage"

      - name: Record unchanged app
        if: steps.upstream.outputs.build != 'true'
        run: |
          mkdir -p out
          printf '%s\n' unchanged > "out/${{ matrix.app }}.status"
          echo "${{ matrix.app }} is unchanged."

      - name: Upload app result
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-${{ matrix.app }}
          path: out/*
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish changed apps to individual repositories
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Download outputs from app builds
        uses: actions/download-artifact@v4
        with:
          pattern: artcraft-*
          path: incoming
          merge-multiple: true

      - name: Publish changed AppImages
        env:
          GH_TOKEN: ${{ secrets.ARTCRAFT_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          publish_app() {
            local app="$1"
            local display="$2"
            local target="$3"
            local image="$4"
            local commit_file="$5"
            local tag sha checksum_dir

            [[ -s "$image" ]] || {
              echo "Missing AppImage for $app: $image" >&2
              return 1
            }

            sha="$(tr -d '\r\n' < "$commit_file")"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Invalid upstream SHA for $app" >&2
              return 1
            }

            tag="v$(TZ=Asia/Kolkata date +'%Y.%m.%d')"
            checksum_dir="$(mktemp -d)"
            cp "$image" "$checksum_dir/"
            (
              cd "$checksum_dir"
              sha256sum ./*.AppImage > SHA256SUMS
            )

            cat > "$checksum_dir/release-notes.txt" <<NOTES
          Unofficial community AppImage build for ${display}.

          Version: ${tag}
          Upstream repository: https://github.com/storytold/${app}
          upstream_commit=${sha}

          SHA256 checksum: see SHA256SUMS.

          These builds are unofficial and are not endorsed by the upstream maintainers.
          NOTES

            echo "Publishing ${display} to ${target} (${tag})"

            if gh release view "$tag" --repo "$target" >/dev/null 2>&1; then
              gh release upload "$tag" \
                "$checksum_dir"/*.AppImage \
                "$checksum_dir/SHA256SUMS" \
                --repo "$target" \
                --clobber

              gh release edit "$tag" \
                --repo "$target" \
                --title "${display} ${tag}" \
                --notes-file "$checksum_dir/release-notes.txt" \
                --latest
            else
              gh release create "$tag" \
                "$checksum_dir"/*.AppImage \
                "$checksum_dir/SHA256SUMS" \
                --repo "$target" \
                --title "${display} ${tag}" \
                --notes-file "$checksum_dir/release-notes.txt" \
                --latest
            fi

            rm -rf "$checksum_dir"
            echo "Published ${display} successfully."
          }

          declare -A targets=(
            [pdfcraft]="barath-207/pdfcraft-appimage"
            [photocraft]="barath-207/photocraft-appimage"
            [gridcraft]="barath-207/gridcraft-appimage"
            [filmcraft]="barath-207/filmcraft-appimage"
            [wordcraft]="barath-207/wordcraft-appimage"
          )

          declare -A displays=(
            [pdfcraft]="PdfCraft"
            [photocraft]="PhotoCraft"
            [gridcraft]="GridCraft"
            [filmcraft]="FilmCraft"
            [wordcraft]="WordCraft"
          )

          declare -A filenames=(
            [pdfcraft]="PdfCraft-latest-x86_64.AppImage"
            [photocraft]="PhotoCraft-latest-x86_64.AppImage"
            [gridcraft]="GridCraft-latest-x86_64.AppImage"
            [filmcraft]="FilmCraft-latest-x86_64.AppImage"
            [wordcraft]="WordCraft-latest-x86_64.AppImage"
          )

          commits=(incoming/*.commit)

          if [[ ${#commits[@]} -eq 0 ]]; then
            echo "No applications changed. Nothing to publish."
            exit 0
          fi

          for commit_file in "${commits[@]}"; do
            app="$(basename "$commit_file" .commit)"
            image="incoming/${filenames[$app]}"

            publish_app \
              "$app" \
              "${displays[$app]}" \
              "${targets[$app]}" \
              "$image" \
              "$commit_file"
          done
